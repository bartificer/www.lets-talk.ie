# Site Settings
title: PBS Jekyll Demo Site

# Build Settings
plugins:
  - jekyll-autoprefixer

# Settings for the autoprefixer plugin
autoprefixer:
  browsers:
    - last 4 versions
    - Safari > 2

# Configure collections
# Note: in collection permalinks, :title defaults to the slug from the front matter
collections:
  lta:
    output: true
    permalink: /:title/
  ltp:
    output: true
    permalink: /:title/