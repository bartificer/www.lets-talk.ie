# Site Settings
title: "Let's Talk Podcasts"

# Build Settings
plugins:
  - jekyll-autoprefixer

# Settings for the autoprefixer plugin
autoprefixer:
  browsers:
    - last 4 versions
    - Safari > 2

# Configure collections
# Note: in collection permalinks, :title defaults to the slug from the front matter
collections:
  contributors:
    output: true
    permalink: /contributor/:title/
  lta:
    output: true
    permalink: /:title/
  ltp:
    output: true
    permalink: /:title/